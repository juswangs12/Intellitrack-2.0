# -----------------------------------
# POSTGRESQL CONFIGURATION (Production Supabase)
# -----------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}

# -----------------------------------
# JPA/HIBERNATE CONFIGURATION
# -----------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# -----------------------------------
# SECURITY CONFIGURATION (Production)
# -----------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Disable H2 console in production
spring.h2.console.enabled=false

# -----------------------------------
# SUPABASE STORAGE CONFIGURATION (S3 Compatible)
# -----------------------------------
# Use these properties to configure Supabase Storage as S3-compatible endpoint
# Set these via RENDER ENVIRONMENT VARIABLES instead!
# aws.s3.endpoint=https://<project-ref>.supabase.co/storage/v1/s3
# aws.access-key-id=<your-supabase-service-role-key>
# aws.secret-access-key=<your-supabase-service-role-key>
# aws.s3.bucket-name=intellitrack-uploads
# aws.s3.region=us-east-1
