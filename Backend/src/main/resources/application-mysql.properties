# -----------------------------------
# MYSQL DATABASE CONFIGURATION (Development - MySQL Workbench)
# -----------------------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/intellitrack2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20

# -----------------------------------
# JPA/HIBERNATE CONFIGURATION
# -----------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run schema migration scripts on startup (idempotent ALTER TABLE fixes)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-migration.sql

# -----------------------------------
# SECURITY CONFIGURATION (Development Defaults)
# -----------------------------------
jwt.secret=9a4f4e35456345e582d411122323232323232323232323232323232323232323
jwt.expiration=86400000

# Disable H2 console for MySQL
spring.h2.console.enabled=false
