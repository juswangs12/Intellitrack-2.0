services:
  - type: web
    name: intellitrack-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /actuator/health/readiness
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_WORKSPACE_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_DEADLINE_SENDER_EMAIL
        value: intelli.track0@gmail.com
      - key: DEADLINE_AUTOMATION_ENABLED
        value: "false"
      - key: DEADLINE_AUTOMATION_TRIGGER_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_FRONTEND_BASE_URL
        sync: false
      - key: aws.access-key-id
        sync: false
      - key: aws.secret-access-key
        sync: false
      - key: aws.s3.bucket-name
        value: intellitrack-uploads
      - key: aws.s3.region
        value: us-east-1
      - key: aws.s3.endpoint
        sync: false
      - key: AI_API_KEY
        sync: false
